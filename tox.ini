[tox]
envlist =
    lint
    typecheck
    stubs
    py310
    py311
    py312
    py313
    py314
    py313t
    py314t
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles the module from what a user would download.
package = sdist
extras = test
set_env =
    CMAKE_BUILD_PARALLEL_LEVEL = {env:CMAKE_BUILD_PARALLEL_LEVEL:4}
# Two runs against the installed package: the suite, and the worked examples in
# the docstrings, which need `--pyargs` to reach the installed copy.
commands =
    pytest {posargs:-q} -o testpaths=tests
    pytest -q --doctest-modules --pyargs pyjoltphysics

[testenv:lint]
skip_install = true
deps = ruff==0.17.1
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
# mypy reads the committed stub for `pyjoltphysics._native`, so the package is
# checked against the signatures the module declares.
extras = test
deps = mypy
commands = mypy src/pyjoltphysics tests

[testenv:asan]
# The suite against the module and Jolt built with
# -fsanitize=address,undefined,float-cast-overflow
# (Linux and gcc): tools/asan.sh builds into the env's directory and runs
# pytest with the sanitizer runtimes preloaded.
skip_install = true
deps =
    cmake
    ninja
    nanobind>=3.1,<4
    numpy
    pytest
allowlist_externals = bash
commands = bash {tox_root}/tools/asan.sh {env_dir}/asan-build {posargs}

[testenv:stubs]
# The stub regenerated from the installed module equals the committed one.
extras = test
change_dir = {env_tmp_dir}
commands =
    python -m nanobind.stubgen -q -p {tox_root}/tools/stub-patterns.txt -m pyjoltphysics._native -o {env_tmp_dir}/_native.pyi
    python -c "import pathlib, sys; a = pathlib.Path(r'{tox_root}/src/pyjoltphysics/_native.pyi').read_text(encoding='utf-8'); b = pathlib.Path(r'{env_tmp_dir}/_native.pyi').read_text(encoding='utf-8'); sys.exit(0 if a == b else 'src/pyjoltphysics/_native.pyi differs from the generated stub; regenerate it')"

# tox-gh maps a CI interpreter to the envs it runs (see .github/workflows).
[gh]
python =
    3.10 = py310
    3.11 = py311
    3.12 = lint, typecheck, stubs, py312
    3.13 = py313
    3.14 = py314
