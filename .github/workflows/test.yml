name: tests

on:
  # This project's own develop, and pull requests. `release.yml` runs this on
  # every push to main and then decides whether the version is worth
  # publishing, so main is covered from there rather than by a `push:` trigger
  # here, which would run the whole matrix twice per push.
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  # The suite on every supported CPython, built from the sdist by tox. The 3.12
  # row also runs `lint` (ruff), `typecheck` (mypy over the package, the tests
  # and the committed stub) and `stubs` (the stub regenerated from the built
  # module equals the committed one).
  test:
    name: ${{ matrix.python-version }} · ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-gh
      - name: Run tox
        run: tox

  # A wheel per platform and interpreter, each installed and tested by
  # cibuildwheel in its own environment (`test-command` in pyproject.toml).
  #
  #   ubuntu-latest     x86_64   manylinux_2_28
  #   ubuntu-24.04-arm  aarch64  manylinux_2_28
  #   macos-latest      arm64    Apple silicon
  #   macos-15-intel    x86_64   Intel Macs; Jolt's CMake applies the x86 SIMD
  #                              flags to the whole build, so there is no
  #                              universal2 wheel
  #   windows-latest    AMD64
  #   windows-11-arm    ARM64
  #
  # Each builds cp310, cp311, the cp312 abi3 wheel (tested on 3.12, 3.13 and
  # 3.14), cp313t and cp314t.
  wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test the wheels
        # cibuildwheel 4.x builds no cp313t, so the 3.x series is pinned.
        run: |
          python -m pip install --upgrade pip "cibuildwheel==3.4.1"
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # The sdist, installed into a clean interpreter and tested from inside the
  # unpacked archive, so a file the sdist failed to carry fails here.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build twine pytest "nanobind>=3.1,<4"
          python -m build --sdist
          python -m twine check --strict dist/*
      - name: Install it
        run: python -m pip install dist/*.tar.gz
      - name: Import it from somewhere that is not the checkout
        run: cd /tmp && python -c "import pyjoltphysics as p; print(p.__version__, p.jolt_version(), p.build_options())"
      - name: Run the suite from inside the unpacked sdist
        run: |
          mkdir -p "${RUNNER_TEMP}/unpacked"
          tar -C "${RUNNER_TEMP}/unpacked" --strip-components=1 -xzf dist/*.tar.gz
          cd "${RUNNER_TEMP}/unpacked" && python -m pytest -q tests -o addopts=
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
